# On a version tag: build a static linux/amd64 binary, sign it keyless
# with cosign (Sigstore) using this workflow's identity, and publish
# asset + bundle as a GitHub release. The iac deploy verifies the bundle
# against this repository and workflow before installing.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # create the release
  id-token: write   # keyless signing
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.24" }
      - name: build
        run: |
          mkdir -p dist/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/bin/canary .
          tar -C dist -czf canary-linux-amd64.tar.gz bin
          sha256sum canary-linux-amd64.tar.gz > canary-linux-amd64.tar.gz.sha256
          # a static site too, so the estate's release-site path can be exercised
          mkdir -p site
          printf '<!doctype html><title>canary site</title><h1>canary site %s</h1>\n' "$GITHUB_REF_NAME" > site/index.html
          tar -C site -czf canary-site.tar.gz .
          sha256sum canary-site.tar.gz > canary-site.tar.gz.sha256
      - uses: sigstore/cosign-installer@v4
      - name: sign
        run: |
          cosign sign-blob --yes --bundle canary-linux-amd64.tar.gz.sigstore.json canary-linux-amd64.tar.gz
          cosign sign-blob --yes --bundle canary-site.tar.gz.sigstore.json canary-site.tar.gz
      - name: release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "canary $GITHUB_REF_NAME" canary-linux-amd64.tar.gz canary-linux-amd64.tar.gz.sha256 canary-linux-amd64.tar.gz.sigstore.json canary-site.tar.gz canary-site.tar.gz.sha256 canary-site.tar.gz.sigstore.json
